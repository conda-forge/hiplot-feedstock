{% set name = "hiplot" %}
{% set version = "0.1.33" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: f78a1bf52fac5dc8a59ac37454978f7343e7659ad8a419dec4c881539126ac9f

build:
  number: 1
  script: {{ PYTHON }} -m pip install . -vv
  noarch: python

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - beautifulsoup4
    - flask
    - flask-compress
    - ipython >=7.0.1
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - hiplot

about:
  home: https://github.com/facebookresearch/hiplot
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: High dimensional Interactive Plotting tool
  doc_url: https://facebookresearch.github.io/hiplot/

extra:
  recipe-maintainers:
    - rpanai
    - danthe3rd
